# Docker Compose for ROR RAG Chat Application
# This file orchestrates the main Next.js application with auth services

services:
  # Main Next.js Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - AUTH_API_URL=http://auth-api:8000
    depends_on:
      auth-api:
        condition: service_healthy
      auth-db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # Authentication Frontend Service
  auth-frontend:
    build:
      context: ./auth/frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - API_URL=http://auth-api:8000
      - API_KEY=${API_KEY}
    depends_on:
      auth-api:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # Authentication API Service
  auth-api:
    build:
      context: ./auth/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=8000
      - DB_HOST=auth-db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-nodejs_app}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - API_KEY=${API_KEY}
    volumes:
      - ./auth/api:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database for Auth Service
  auth-db:
    image: postgres:15-alpine
    container_name: auth-postgres-db
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME:-nodejs_app}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
      - ./auth/api/src/db:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=${DB_PASSWORD:-postgres} pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-nodejs_app}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Documentation Server (Optional)
  auth-docs:
    image: node:20-alpine
    container_name: auth-docs-server
    ports:
      - "8001:8001"
    volumes:
      - ./auth/api:/app
      - ./auth/api/docs:/app/docs
    working_dir: /app
    command: >
      sh -c "
        npm install -g jsdoc http-server &&
        jsdoc src/**/*.js -d docs --configure jsdoc.conf.json 2>/dev/null || jsdoc src/**/*.js -d docs &&
        echo 'Documentation generated successfully' &&
        http-server docs -p 8001 -a 0.0.0.0
      "
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - auth-api

  # Database Administration Interface (Optional)
  adminer:
    image: adminer:latest
    container_name: auth-adminer
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - auth-db

# Network configuration
networks:
  app-network:
    driver: bridge

# Volume configuration
volumes:
  auth_postgres_data:
    driver: local
